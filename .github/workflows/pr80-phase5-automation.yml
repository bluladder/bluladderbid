          test_text += r'''

          function setPhase5AddressSession(sb: any) {
            setFirmWindowSession(sb, "schedule");
            sb._state.session.fields = {
              ...sb._state.session.fields,
              name: "Casey Caller",
              email: "casey.phase5@example.invalid",
              phone: "+14695550155",
              callerIdConfirmationStatus: "contact_confirmed",
