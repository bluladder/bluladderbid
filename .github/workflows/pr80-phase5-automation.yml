      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Format and validate focused Phase 5 files
        shell: bash
        run: |
          set -euo pipefail
          deno fmt \
            supabase/functions/_shared/voice/voiceAddressGate.ts \
            supabase/functions/_shared/workflow/workflowController.ts \
            supabase/functions/_shared/workflow/workflowController_rollout_test.ts
          deno fmt --check \
            supabase/functions/_shared/voice/voiceAddressGate.ts \
            supabase/functions/_shared/workflow/workflowController.ts \
            supabase/functions/_shared/workflow/workflowController_rollout_test.ts
          deno lint \
            supabase/functions/_shared/voice/voiceAddressGate.ts \
            supabase/functions/_shared/workflow/workflowController.ts \
            supabase/functions/_shared/workflow/workflowController_rollout_test.ts
          deno test --allow-all \
            supabase/functions/_shared/workflow/workflowController_rollout_test.ts
          deno test --allow-all supabase/functions/_shared

      - name: Commit only the reviewed Phase 5 result
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object supabase/release-candidates/voice_turn_single_flight.sql)" = "d78b7142c649cfa623ec66a0805e986758a0ca91"
          git rm .github/workflows/pr80-phase5-automation.yml
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/pr80-phase5-automation.yml \
            supabase/functions/_shared/voice/voiceAddressGate.ts \
            supabase/functions/_shared/workflow/workflowController.ts \
            supabase/functions/_shared/workflow/workflowController_rollout_test.ts | sort)"
          test "$actual" = "$expected"
          git config user.name "bluladder-pr80-automation"
          git config user.email "304095287+bluladder@users.noreply.github.com"
          git add \
            supabase/functions/_shared/voice/voiceAddressGate.ts \
            supabase/functions/_shared/workflow/workflowController.ts \
            supabase/functions/_shared/workflow/workflowController_rollout_test.ts
          git commit -m "feat(voice): bound address confirmation before scheduling"
          git push origin HEAD:codex/voice-express-quote-repair

      - name: Dispatch exact-head CI and secret scan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ci.yml --ref codex/voice-express-quote-repair
          gh workflow run secret-scan.yml --ref codex/voice-express-quote-repair
