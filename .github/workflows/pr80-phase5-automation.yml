name: PR80 Phase 5 automation

on:
  push:
    branches:
      - codex/voice-express-quote-repair

permissions:
  contents: write
  actions: write

concurrency:
  group: pr80-phase5-automation
  cancel-in-progress: false

jobs:
  apply-phase5:
    if: "${{ github.event.head_commit.message == 'chore(automation): prepare PR 80 Phase 5' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact PR branch head
        uses: actions/checkout@v4
        with:
          ref: codex/voice-express-quote-repair
          fetch-depth: 0

      - name: Verify guarded starting point
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "b0c19b228e6fafb434dbdf18bdda7ca36be2f1a8"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/pr80-phase5-automation.yml"
          test "$(git hash-object supabase/release-candidates/voice_turn_single_flight.sql)" = "d78b7142c649cfa623ec66a0805e986758a0ca91"

      - name: Apply exact Phase 5 transformations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              file.write_text(text.replace(old, new, 1))

          address_gate = "supabase/functions/_shared/voice/voiceAddressGate.ts"
          replace_once(
              address_gate,
              "export const MAX_ADDRESS_COMPONENT_ATTEMPTS = 2;",
              "export const MAX_ADDRESS_COMPONENT_ATTEMPTS = 1;",
          )

          replace_once(
              address_gate,
              '''  if (component === "state") {
            if (/\b(texas|tx)\b/i.test(raw)) return "TX";
            return /^[A-Za-z]{2}$/.test(raw) ? raw.toUpperCase() : null;
          }
          if (component === "unit") return raw.length <= 20 ? raw : null;
          if (component === "street") {
            const corrected = raw.match(
              /\b([A-Za-z][A-Za-z'’-]{1,40})\s+(?:not|instead of)\s+[A-Za-z][A-Za-z'’-]{1,40}/i,
            )?.[1];
            const letters = [...raw.matchAll(
              /\b([A-Za-z])\s+(?:as\s+in|for|like)\s+[A-Za-z][A-Za-z'’-]*/gi,
            )].map((match) => match[1]);
            const suffixMatches = [...raw.matchAll(
              /\b(street|st|road|rd|drive|dr|lane|ln|court|ct|avenue|ave|boulevard|blvd|way|circle|cir|trail|trl|parkway|pkwy)\b/gi,
            )];
            // A spelling phrase may contain a suffix-shaped example ("R as in road").
            // The actual suffix is the final suffix token supplied by the caller.
            const suffix = suffixMatches.at(-1)?.[1];
            if (letters.length >= 3) {
              const spelled = letters.join("");
              return [
                spelled.charAt(0).toUpperCase() + spelled.slice(1).toLowerCase(),
                suffix ? expandStreetSuffix(suffix) : "",
              ].filter(Boolean).join(" ");
            }
            if (corrected) {
              return [corrected, suffix ? expandStreetSuffix(suffix) : ""]
                .filter(Boolean).join(" ");
            }
          }
          return raw.length <= 80 && !/@/.test(raw) ? raw : null;''',
              '''  if (component === "state") {
            if (/\b(texas|tx)\b/i.test(raw)) return "TX";
            return /^[A-Za-z]{2}$/.test(raw) ? raw.toUpperCase() : null;
          }
          if (component === "city") {
            const explicit = raw.match(
              /\bcity(?:\s+is)?\s+([A-Za-z][A-Za-z'’.-]*(?:\s+[A-Za-z][A-Za-z'’.-]*){0,3})\b/i,
            )?.[1];
            const value = (explicit ?? raw).replace(/[.!?]+$/, "").trim();
            return /^[A-Za-z][A-Za-z'’.-]*(?:\s+[A-Za-z][A-Za-z'’.-]*){0,3}$/
                .test(value)
              ? value
              : null;
          }
          if (component === "unit") return raw.length <= 20 ? raw : null;
          if (component === "street") {
            const direct = raw.replace(
              /^(?:no[, ]+)?(?:the\s+)?street(?:\s+name)?(?:\s+is)?\s+/i,
              "",
            ).replace(/[.!?]+$/, "").trim();
            const corrected = raw.match(
              /\b([A-Za-z][A-Za-z'’-]{1,40})\s+(?:not|instead of)\s+[A-Za-z][A-Za-z'’-]{1,40}/i,
            )?.[1];
            const letters = [...raw.matchAll(
              /\b([A-Za-z])\s+(?:as\s+in|for|like)\s+[A-Za-z][A-Za-z'’-]*/gi,
            )].map((match) => match[1]);
            const suffixMatches = [...raw.matchAll(
              /\b(street|st|road|rd|drive|dr|lane|ln|court|ct|avenue|ave|boulevard|blvd|way|circle|cir|trail|trl|parkway|pkwy)\b/gi,
            )];
            // A spelling phrase may contain a suffix-shaped example ("R as in road").
            // The actual suffix is the final suffix token supplied by the caller.
            const suffix = suffixMatches.at(-1)?.[1];
            if (letters.length >= 3) {
              const spelled = letters.join("");
              return [
                spelled.charAt(0).toUpperCase() + spelled.slice(1).toLowerCase(),
                suffix ? expandStreetSuffix(suffix) : "",
              ].filter(Boolean).join(" ");
            }
            if (corrected) {
              return [corrected, suffix ? expandStreetSuffix(suffix) : ""]
                .filter(Boolean).join(" ");
            }
            if (direct !== raw && direct.length <= 80) return direct;
          }
          return raw.length <= 80 && !/@/.test(raw) ? raw : null;''',
          )

          replace_once(
              address_gate,
              '''/** Split "5612 Binbranch Lane, McKinney, TX 75071" for a spoken readback. */
          export function buildAddressReadback(formatted: string): string {
            const segs = String(formatted ?? "").split(",").map((s) => s.trim()).filter(
              Boolean,
            );
            const street = segs[0] ?? "";
            const tail = segs.slice(1).join(", ");
            const words = street.split(/\s+/).filter(Boolean);
            const house = houseNumberOf(street);
            const body = house ? words.slice(1) : words;
            const suffix = body.length > 1
              ? expandStreetSuffix(body[body.length - 1])
              : "";
            const name = (body.length > 1 ? body.slice(0, -1) : body).join(" ");
            const parts: string[] = [];
            if (house) parts.push(speakDigits(house));
            if (name) parts.push(`${name}, spelled ${spellOut(name)}`);
            if (suffix) parts.push(suffix);
            const spoken = [parts.join(" "), tail].filter(Boolean).join(", ");
            return `I have ${spoken}. Is that exactly right?`;
          }''',
              '''/** Build one concise confirmation while still reading the house number digit by digit. */
          export function buildAddressReadback(formatted: string): string {
            const segs = String(formatted ?? "").split(",").map((s) => s.trim()).filter(
              Boolean,
            );
            const street = segs[0] ?? "";
            const remainder = segs.slice(1);
            const unit = remainder.find((segment) =>
              /^(?:apt|apartment|unit|suite|#)\b/i.test(segment)
            ) ?? "";
            const city = remainder.find((segment) =>
              segment !== unit && !/^[A-Z]{2}\b(?:\s+\d{5})?/i.test(segment)
            ) ?? "";
            const words = street.split(/\s+/).filter(Boolean);
            const house = houseNumberOf(street);
            const body = house ? words.slice(1) : words;
            const suffix = body.length > 1
              ? expandStreetSuffix(body[body.length - 1])
              : "";
            const name = (body.length > 1 ? body.slice(0, -1) : body).join(" ");
            const parts: string[] = [];
            if (house) parts.push(speakDigits(house));
            if (name) parts.push(name);
            if (suffix) parts.push(suffix);
            const conciseStreet = [parts.join(" "), unit].filter(Boolean).join(", ") ||
              street || formatted;
            return `I found ${conciseStreet}${city ? ` in ${city}` : ""}. Is that correct?`;
          }''',
          )

          controller = "supabase/functions/_shared/workflow/workflowController.ts"
          replace_once(
              controller,
              '''function isControllerOwnedManualReviewTerminal(
            lastStep: string | null | undefined,
          ): boolean {
            return lastStep?.startsWith("manual_review:retry_exhausted:") === true ||
              lastStep?.startsWith("manual_review:conditional_modifier_budget:") === true;
          }''',
              '''function isControllerOwnedManualReviewTerminal(
            lastStep: string | null | undefined,
          ): boolean {
            return lastStep?.startsWith("manual_review:retry_exhausted:") === true ||
              lastStep?.startsWith("manual_review:conditional_modifier_budget:") === true ||
              lastStep === "manual_review:address_uncertain";
          }''',
          )

          replace_once(
              controller,
              '''  const capture = (next: QuoteSession, lastStep = next.lastStep ?? null) => {
            session = { ...next, lastStep };
            sessionPatch.fields = session.fields;
            sessionPatch.field_status = session.fieldStatus;
            sessionPatch.required_remaining = computeRequired(session.fields);
            sessionPatch.quote_status = session.quoteStatus;
            sessionPatch.booking_ready = session.bookingReady;
            sessionPatch.last_step = lastStep;
          };

          if (isControllerOwnedManualReviewTerminal(session.lastStep)) {''',
              '''  const capture = (next: QuoteSession, lastStep = next.lastStep ?? null) => {
            session = { ...next, lastStep };
            sessionPatch.fields = session.fields;
            sessionPatch.field_status = session.fieldStatus;
            sessionPatch.required_remaining = computeRequired(session.fields);
            sessionPatch.quote_status = session.quoteStatus;
            sessionPatch.booking_ready = session.bookingReady;
            sessionPatch.last_step = lastStep;
          };

          const addressClarificationAttempts = (): number =>
            Math.max(
              0,
              Number(session.fields.voiceJourney?.retryCounts?.address ?? 0) || 0,
            );

          const addressManualReview = (
            spoken =
              "I couldn't confirm the service address safely, so I kept your quote but stopped scheduling. A team member can verify the address with you.",
          ): ControllerTurnResult => {
            const retryCounts = session.fields.voiceJourney?.retryCounts ?? {};
            const next = mergeFields(
              session,
              {
                serviceAreaStatus: "manual_review_required",
                voiceJourney: {
                  ...(session.fields.voiceJourney ?? {}),
                  retryCounts,
                  pendingAddressComponent: null,
                  requestedNextStep: "none",
                  availability: null,
                  booking: { status: "not_started" as const },
                },
              },
              { markDerived: ["serviceAreaStatus"] },
            );
            capture(
              { ...next, quoteStatus: session.quoteStatus, bookingReady: false },
              "manual_review:address_uncertain",
            );
            return {
              sessionId: session.id,
              sessionPatch,
              pre: {
                kind: "fsm",
                action: { kind: "handoff", reason: "safety_or_access_flag" },
                spoken,
              },
            };
          };

          const beginAddressClarification = (
            lastStep: string,
            spoken: string,
          ): ControllerTurnResult => {
            const attempts = addressClarificationAttempts();
            if (attempts >= VOICE_QUOTE_POLICY.address.clarificationLimit) {
              return addressManualReview();
            }
            const retryCounts = session.fields.voiceJourney?.retryCounts ?? {};
            capture(
              mergeFields(session, {
                voiceJourney: {
                  ...(session.fields.voiceJourney ?? {}),
                  retryCounts: { ...retryCounts, address: attempts + 1 },
                },
              }),
              lastStep,
            );
            return {
              sessionId: session.id,
              sessionPatch,
              pre: {
                kind: "fsm",
                action: {
                  kind: "ask",
                  field: "address",
                  prompt: spoken,
                } as unknown as WorkflowAction,
                spoken,
              },
            };
          };

          if (isControllerOwnedManualReviewTerminal(session.lastStep)) {''',
          )

          replace_once(
              controller,
              '''    if (status === "address_incomplete") {
            const missing = nextMissingAddressComponent(components);
            capture(
              mergeFields(session, {
                addressComponents: components,
                serviceAreaStatus: "unavailable",
                serviceAreaResult: raw,
                voiceJourney: {
