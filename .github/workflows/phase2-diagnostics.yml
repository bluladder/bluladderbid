name: Phase 2 Diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      - run: bun install --frozen-lockfile
      - name: Capture frontend tests
        shell: bash
        run: |
          set +e
          bun run test > frontend-test-output.txt 2>&1
          echo $? > frontend-test-exit.txt
          exit 0
      - name: Capture production build
        shell: bash
        run: |
          set +e
          bun run build > frontend-build-output.txt 2>&1
          echo $? > frontend-build-exit.txt
          exit 0
      - name: Capture Deno tests
        shell: bash
        run: |
          set +e
          deno test --allow-all --no-check supabase/functions/_shared > deno-test-output.txt 2>&1
          echo $? > deno-test-exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: phase2-diagnostics
          path: |
            frontend-test-output.txt
            frontend-test-exit.txt
            frontend-build-output.txt
            frontend-build-exit.txt
            deno-test-output.txt
            deno-test-exit.txt
