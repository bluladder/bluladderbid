name: PR80 Phase 5 compatibility repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pr80-phase5-compatibility-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'codex/voice-express-quote-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify guarded starting commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "e2e34da58859aa00e2ddc4f2be64ca4690c575d7"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/pr80-phase5-compatibility-repair.yml"
          test -z "$(git status --porcelain)"
          test "$(git hash-object supabase/release-candidates/voice_turn_single_flight.sql)" = "d78b7142c649cfa623ec66a0805e986758a0ca91"

      - name: Reconcile superseded address-readback assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "supabase/functions/_shared/voice/voiceAddressGate.ts": [
                  (
                      "address. The readback spells the street and reads the house number digit by\n// digit, because ASR routinely mangles both",
                      "address. The readback preserves the canonical street wording and reads the\n// house number digit by digit, because ASR routinely mangles both",
                  ),
              ],
              "supabase/functions/_shared/voice/voiceRemediation67_test.ts": [
                  (
                      'assertStringIncludes(gate.reply, "Is that exactly right?");',
                      'assertStringIncludes(gate.reply, "Is that correct?");',
                  ),
                  (
                      'Deno.test("readback spells the street and reads digits", () => {',
                      'Deno.test("readback preserves the canonical street and reads digits", () => {',
                  ),
                  (
                      'assertStringIncludes(readback, "B-I-N-B-R-A-N-C-H");',
                      'assertStringIncludes(readback, "Binbranch Lane");',
                  ),
              ],
              "supabase/functions/_shared/voice/voiceRemediation68_test.ts": [
                  (
                      'assertStringIncludes(spoken, "Is that exactly right?");',
                      'assertStringIncludes(spoken, "Is that correct?");',
                  ),
                  (
                      'assertStringIncludes(turn2.reply, "B-I-N-B-R-A-N-C-H");',
                      'assertStringIncludes(turn2.reply, "Binbranch Lane");',
                  ),
              ],
              "docs/voice/phase5-address-confirmation.md": [
                  (
                      "- The readback is concise, spells the street context safely, and reads the house number digit by digit.",
                      "- The readback is concise, preserves the canonical street wording, expands suffixes for speech, and reads the house number digit by digit.",
                  ),
              ],
          }

          for file_name, pairs in replacements.items():
              path = Path(file_name)
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{file_name}: expected one occurrence, found {count}: {old!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
          git diff --check

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Validate Phase 5 and complete shared suite
        shell: bash
        run: |
          set -euo pipefail
          deno fmt \
            supabase/functions/_shared/voice/voiceAddressGate.ts \
            supabase/functions/_shared/voice/voiceRemediation67_test.ts \
            supabase/functions/_shared/voice/voiceRemediation68_test.ts
          deno fmt --check supabase/functions
          deno lint supabase/functions
          deno test --allow-all \
            supabase/functions/_shared/voice/voiceRemediation67_test.ts \
            supabase/functions/_shared/voice/voiceRemediation68_test.ts \
            supabase/functions/_shared/workflow/workflowController_rollout_test.ts
          deno test --allow-all supabase/functions/_shared

      - name: Publish compatibility repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f deno.lock
          rm .github/workflows/pr80-phase5-compatibility-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/pr80-phase5-compatibility-repair.yml \
            docs/voice/phase5-address-confirmation.md \
            supabase/functions/_shared/voice/voiceAddressGate.ts \
            supabase/functions/_shared/voice/voiceRemediation67_test.ts \
            supabase/functions/_shared/voice/voiceRemediation68_test.ts | sort)"
          printf 'Staged paths:\n%s\n' "$actual"
          test "$actual" = "$expected"
          git diff --cached --check
          test "$(git hash-object supabase/release-candidates/voice_turn_single_flight.sql)" = "d78b7142c649cfa623ec66a0805e986758a0ca91"
          git commit -m "test(voice): reconcile Phase 5 address readback contract"
          git push origin HEAD:codex/voice-express-quote-repair
