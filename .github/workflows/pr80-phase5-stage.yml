name: PR80 Phase 5 staging

on:
  push:
    branches:
      - tmp-do-not-use-test

permissions:
  contents: write

concurrency:
  group: pr80-phase5-staging
  cancel-in-progress: false

jobs:
  apply-verify-publish:
    if: "${{ github.event.head_commit.message == 'chore(staging): execute PR 80 Phase 5' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact staging event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify guarded staging boundary
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 6027322d2db5f4ad9bf63e92d78ff5cf153ca526 HEAD
          actual="$(git diff --name-only 6027322d2db5f4ad9bf63e92d78ff5cf153ca526 HEAD | sort)"
          expected="$(printf '%s\n' \
            .github/pr80-phase5-trigger \
            .github/workflows/pr80-phase5-stage.yml | sort)"
          test "$actual" = "$expected"
          test "$(git hash-object supabase/release-candidates/voice_turn_single_flight.sql)" = "d78b7142c649cfa623ec66a0805e986758a0ca91"
          test -z "$(git status --porcelain)"

      - name: Recover reviewed Phase 5 transformer from branch history
        shell: bash
        run: |
          set -euo pipefail
          git show 2911da42dcc1a3f4dd8718a9d1befc9d68a123ba:scripts/pr80_phase5_transform.py > /tmp/pr80_phase5_transform.py
          python3 -m py_compile /tmp/pr80_phase5_transform.py

      - name: Apply Phase 5 source and acceptance tests
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/pr80_phase5_transform.py
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            supabase/functions/_shared/voice/voiceAddressGate.ts \
            supabase/functions/_shared/workflow/workflowController.ts \
            supabase/functions/_shared/workflow/workflowController_rollout_test.ts | sort)"
          test "$actual" = "$expected"
          git diff --check
          test "$(git hash-object supabase/release-candidates/voice_turn_single_flight.sql)" = "d78b7142c649cfa623ec66a0805e986758a0ca91"

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Format and validate changed Deno files
        shell: bash
        run: |
          set -euo pipefail
          deno fmt \
            supabase/functions/_shared/voice/voiceAddressGate.ts \
            supabase/functions/_shared/workflow/workflowController.ts \
            supabase/functions/_shared/workflow/workflowController_rollout_test.ts
          deno fmt --check \
            supabase/functions/_shared/voice/voiceAddressGate.ts \
            supabase/functions/_shared/workflow/workflowController.ts \
            supabase/functions/_shared/workflow/workflowController_rollout_test.ts
          deno lint \
            supabase/functions/_shared/voice/voiceAddressGate.ts \
            supabase/functions/_shared/workflow/workflowController.ts \
            supabase/functions/_shared/workflow/workflowController_rollout_test.ts
          deno test --allow-all \
            supabase/functions/_shared/workflow/workflowController_rollout_test.ts
          deno test --allow-all supabase/functions/_shared

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate repository contracts
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bunx tsc --noEmit
          bun run check:tenant-authority-stage-7b-v2
          bun run check:voice-booking-contract
          bun run check:organization-pricing
          bun run check:provider-config-contract
          cmp -s src/lib/pricing/engine.ts supabase/functions/_shared/pricingEngine.ts
          git diff --check
          test "$(git hash-object supabase/release-candidates/voice_turn_single_flight.sql)" = "d78b7142c649cfa623ec66a0805e986758a0ca91"

      - name: Publish one source-only Phase 5 commit to staging
        shell: bash
        run: |
          set -euo pipefail
          rm .github/pr80-phase5-trigger .github/workflows/pr80-phase5-stage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          actual="$(git diff --cached --name-status | sort)"
          expected="$(printf '%s\n' \
            'D\t.github/pr80-phase5-trigger' \
            'D\t.github/workflows/pr80-phase5-stage.yml' \
            'M\tsupabase/functions/_shared/voice/voiceAddressGate.ts' \
            'M\tsupabase/functions/_shared/workflow/workflowController.ts' \
            'M\tsupabase/functions/_shared/workflow/workflowController_rollout_test.ts' | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git commit -m "feat(voice): complete Phase 5 address confirmation"
          git push origin HEAD:tmp-do-not-use-test
