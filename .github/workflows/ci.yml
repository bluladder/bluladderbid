name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Tenant inventory and migration contracts
        run: |
          bun run check:tenant-inventory
          bun run check:tenant-foundation
          bun run check:tenant-authority-stage-7b-v2
          bun run check:tenant-readiness
          bun run check:stage-7d-migration-gate
          bun run check:stage-7d-independent-audit
          bun run check:stage-7d-repair-rehearsal
          bun run check:stage-7b-forward-release
          bun run check:stage-7b-corrected-release
          bun run check:stage-7b-lovable-release
          bun run check:stage-7d-cron-window
          bun run check:organization-routing
          bun run check:roadmap-ledger
          bun run check:organization-connectors
          bun run check:organization-pricing
          bun run check:customer-intelligence
          bun run check:tenant-isolation-integration
          bun run check:launch-contract
          bun run check:hosted-launch-package
          bun run check:provider-config-contract
          bun run check:protected-launch-evaluator
          bun run check:voice-booking-contract
          bun run check:voice-artifact-retention-contract
          bun run check:voice-artifact-retention-lovable-release

      - name: Unit tests (vitest)
        run: bun run test

      - name: Production build
        run: bun run build

  edge-functions:
    name: Edge functions (deno fmt · lint · test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Deno format check
        run: deno fmt --check supabase/functions
        continue-on-error: true

      - name: Deno lint
        run: deno lint supabase/functions
        continue-on-error: true

      - name: Deno tests
        run: deno test --allow-all supabase/functions/_shared

  stage-7b-postgres-rehearsal:
    name: Stage 7B disposable PostgreSQL rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Create disposable database
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host localhost --username postgres stage7b_rehearsal
          createdb --host localhost --username postgres stage7b_lovable_rehearsal
          createdb --host localhost --username postgres stage7b_v2_rehearsal
          createdb --host localhost --username postgres voice_retention_rehearsal
          createdb --host localhost --username postgres voice_retention_lovable_rehearsal
          createdb --host localhost --username postgres voice_retention_lovable_rebuild_rehearsal
          createdb --host localhost --username postgres voice_turn_single_flight_rehearsal
      - name: Rehearse immutable direct-psql Stage 7B payload
        env:
          STAGE7B_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stage7b_rehearsal
        run: ./scripts/rehearse-stage-7b-postgres.sh
      - name: Rehearse immutable Lovable-native Stage 7B payload
        env:
          STAGE7B_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stage7b_lovable_rehearsal
        run: bash scripts/rehearse-stage-7b-lovable-postgres.sh
      - name: Rehearse Stage 7B v2 tenant authority migration
        env:
          STAGE7B_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stage7b_v2_rehearsal
        run: bash scripts/rehearse-stage-7b-v2-postgres.sh
      - name: Rehearse bounded voice artifact retention
        env:
          VOICE_RETENTION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/voice_retention_rehearsal
        run: bash scripts/rehearse-voice-artifact-retention-postgres.sh
      - name: Rehearse Lovable voice retention release control
        env:
          VOICE_RETENTION_LOVABLE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/voice_retention_lovable_rehearsal
          VOICE_RETENTION_LOVABLE_REBUILD_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/voice_retention_lovable_rebuild_rehearsal
        run: bash scripts/rehearse-voice-artifact-retention-lovable-postgres.sh
      - name: Rehearse voice turn single-flight release candidate
        env:
          VOICE_TURN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/voice_turn_single_flight_rehearsal
        run: bash scripts/rehearse-voice-turn-single-flight-postgres.sh

  campaigns-inactive-guard:
    name: Campaigns inactive guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Fail if a migration sets campaigns.status = 'active'
        run: |
          set -e
          if grep -RniE "campaigns\b.*status[[:space:]]*=[[:space:]]*'active'" supabase/migrations 2>/dev/null; then
            echo "::error::A migration activates a campaign. Campaign activation must be done via the admin UI, not migrations."
            exit 1
          fi
          echo "OK: no campaign activation found in migrations."

  phase5-source-stage:
    name: Phase 5 address — apply, verify, and publish source
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/voice-express-quote-repair'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify guarded starting point
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "19ab6ce452b46a42b777869ce224b1d388a62888"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/ci.yml"
          test "$(git hash-object supabase/release-candidates/voice_turn_single_flight.sql)" = "d78b7142c649cfa623ec66a0805e986758a0ca91"
          test -z "$(git status --porcelain)"

      - name: Recover and apply reviewed Phase 5 transformer
        shell: bash
        run: |
          set -euo pipefail
          git show 2911da42dcc1a3f4dd8718a9d1befc9d68a123ba:scripts/pr80_phase5_transform.py > /tmp/pr80_phase5_transform.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          path = Path('/tmp/pr80_phase5_transform.py')
          text = path.read_text()
          start = text.find('def block(value: str) -> str:')
          end = text.find('\n\nADDRESS_GATE =', start)
          if start < 0 or end < 0:
              raise SystemExit(f'Phase 5 helper block markers missing: start={start}, end={end}')

          helpers = r'''def block(value: str) -> str:
              return textwrap.dedent(value).lstrip("\n")


          def _leading_indent(value: str) -> str:
              for line in value.split("\n"):
                  if line.strip():
                      return line[: len(line) - len(line.lstrip(" \t"))]
              return ""


          def _align(value: str, target_indent: str) -> str:
              current = _leading_indent(value)
              if current == target_indent:
                  return value
              if target_indent.startswith(current):
                  extra = target_indent[len(current):]
                  return "\n".join(
                      extra + line if line.strip() else line
                      for line in value.split("\n")
                  )
              return value


          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              source = file.read_text()
              if source.count(old) == 1:
                  file.write_text(source.replace(old, _align(new, _leading_indent(old)), 1))
                  return
              candidates: list[tuple[str, str]] = []
              if "\n" in old:
                  for spaces in range(1, 17):
                      prefix = " " * spaces
                      indented_old = "\n".join(
                          prefix + line if line.strip() else line
                          for line in old.split("\n")
                      )
                      if source.count(indented_old) == 1:
                          candidates.append((indented_old, prefix))
              if len(candidates) != 1:
                  raise SystemExit(
                      f"{path}: expected one exact or uniformly indented occurrence, found {len(candidates)}: {old[:100]!r}"
                  )
              matched, prefix = candidates[0]
              file.write_text(source.replace(matched, _align(new, prefix), 1))


          def regex_once(path: str, pattern: str, replacement: str, flags: int = 0) -> None:
              file = Path(path)
              source = file.read_text()
              matches = list(re.finditer(pattern, source, flags=flags))
              if len(matches) != 1:
                  raise SystemExit(
                      f"{path}: expected one regex occurrence, found {len(matches)}: {pattern[:120]!r}"
                  )
              match = matches[0]
              prefix = _leading_indent(match.group(0))
              updated = source[:match.start()] + _align(replacement, prefix) + source[match.end():]
              file.write_text(updated)


          def replace_region(path: str, start_marker: str, end_marker: str, replacement: str) -> None:
              file = Path(path)
              source = file.read_text()
              start_index = source.find(start_marker)
              if start_index < 0:
                  raise SystemExit(f"{path}: start marker not found: {start_marker[:120]!r}")
              end_index = source.find(end_marker, start_index + len(start_marker))
              if end_index < 0:
                  raise SystemExit(f"{path}: end marker not found: {end_marker[:120]!r}")
              prefix = _leading_indent(start_marker)
              file.write_text(
                  source[:start_index] + _align(replacement, prefix) + source[end_index:]
              )
          '''
          helpers = textwrap.dedent(helpers)
          path.write_text(text[:start] + helpers + text[end:])
          PY
          python3 -m py_compile /tmp/pr80_phase5_transform.py
          python3 /tmp/pr80_phase5_transform.py
          python3 - <<'PY'
          from pathlib import Path

          controller = Path('supabase/functions/_shared/workflow/workflowController.ts')
          controller_text = controller.read_text()
          old_classifier = 'if (/\\bstreet|road|drive|lane|avenue|boulevard\\b|\\bnot\\b/i.test(text)) {'
          new_classifier = 'if (/\\bstreet|road|drive|lane|avenue|boulevard\\b/i.test(text)) {'
          if controller_text.count(old_classifier) != 1:
              raise SystemExit(
                  f'Expected one overbroad street classifier occurrence, found {controller_text.count(old_classifier)}'
              )
          controller.write_text(controller_text.replace(old_classifier, new_classifier, 1))

          test = Path('supabase/functions/_shared/workflow/workflowController_rollout_test.ts')
          test_text = test.read_text()
          old_label = 'const [label, discountRows, expected] of ['
          new_label = 'const [_label, discountRows, expected] of ['
          if test_text.count(old_label) != 1:
              raise SystemExit(f'Expected one inherited unused label occurrence, found {test_text.count(old_label)}')
          test.write_text(test_text.replace(old_label, new_label, 1))
          PY
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            supabase/functions/_shared/voice/voiceAddressGate.ts \
            supabase/functions/_shared/workflow/workflowController.ts \
            supabase/functions/_shared/workflow/workflowController_rollout_test.ts | sort)"
          test "$actual" = "$expected"
          git diff --check

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Format, lint, and targeted-test Phase 5
        shell: bash
        run: |
          set -euo pipefail
          deno fmt \
            supabase/functions/_shared/voice/voiceAddressGate.ts \
            supabase/functions/_shared/workflow/workflowController.ts \
            supabase/functions/_shared/workflow/workflowController_rollout_test.ts
          deno fmt --check \
            supabase/functions/_shared/voice/voiceAddressGate.ts \
            supabase/functions/_shared/workflow/workflowController.ts \
            supabase/functions/_shared/workflow/workflowController_rollout_test.ts
          deno lint \
            supabase/functions/_shared/voice/voiceAddressGate.ts \
            supabase/functions/_shared/workflow/workflowController.ts \
            supabase/functions/_shared/workflow/workflowController_rollout_test.ts
          targeted_success=0
          for attempt in 1 2 3; do
            if deno test --allow-all \
              supabase/functions/_shared/workflow/workflowController_rollout_test.ts; then
              targeted_success=1
              break
            fi
            echo "Targeted Deno attempt ${attempt} failed; retrying after 10 seconds."
            sleep 10
          done
          test "$targeted_success" -eq 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate repository contracts
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bunx tsc --noEmit
          bun run check:tenant-authority-stage-7b-v2
          bun run check:voice-booking-contract
          bun run check:organization-pricing
          bun run check:provider-config-contract
          cmp -s src/lib/pricing/engine.ts supabase/functions/_shared/pricingEngine.ts
          git diff --check
          test "$(git hash-object supabase/release-candidates/voice_turn_single_flight.sql)" = "d78b7142c649cfa623ec66a0805e986758a0ca91"

      - name: Publish source-only Phase 5 commit
        shell: bash
        run: |
          set -euo pipefail
          git checkout 6027322d2db5f4ad9bf63e92d78ff5cf153ca526 -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          actual="$(git diff --cached --name-status | sort)"
          expected="$(printf '%s\n' \
            'M\t.github/workflows/ci.yml' \
            'M\tsupabase/functions/_shared/voice/voiceAddressGate.ts' \
            'M\tsupabase/functions/_shared/workflow/workflowController.ts' \
            'M\tsupabase/functions/_shared/workflow/workflowController_rollout_test.ts' | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git commit -m "feat(voice): complete Phase 5 address confirmation"
          git push origin HEAD:codex/voice-express-quote-repair
