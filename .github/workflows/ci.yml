name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Tenant inventory and migration contracts
        run: |
          bun run check:tenant-inventory
          bun run check:tenant-foundation
          bun run check:tenant-authority-stage-7b-v2
          bun run check:tenant-readiness
          bun run check:stage-7d-migration-gate
          bun run check:stage-7d-independent-audit
          bun run check:stage-7d-repair-rehearsal
          bun run check:stage-7b-forward-release
          bun run check:stage-7b-corrected-release
          bun run check:stage-7b-lovable-release
          bun run check:stage-7d-cron-window
          bun run check:organization-routing
          bun run check:roadmap-ledger
          bun run check:organization-connectors
          bun run check:organization-pricing
          bun run check:klamath-phase-0b
          bun run check:klamath-phase-1a
          bun run check:klamath-phase-1b
          bun run check:klamath-phase-1c
          bun run check:klamath-phase-1d
          bun run check:klamath-phase-1e
          bun run check:klamath-phase-1f
          bun run check:klamath-phase-1g
          bun run check:klamath-hosted-compat
          bun run check:customer-intelligence
          bun run check:tenant-isolation-integration
          bun run check:launch-contract
          bun run check:hosted-launch-package
          bun run check:provider-config-contract
          bun run check:protected-launch-evaluator
          bun run check:voice-booking-contract
          bun run check:voice-artifact-retention-contract
          bun run check:voice-artifact-retention-lovable-release

      - name: Unit tests (vitest)
        run: bun run test

      - name: Production build
        run: bun run build

  edge-functions:
    name: Edge functions (deno fmt · lint · test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Deno format check
        run: deno fmt --check supabase/functions
        continue-on-error: true

      - name: Deno lint
        run: deno lint supabase/functions
        continue-on-error: true

      - name: Deno tests
        run: deno test --allow-all supabase/functions/_shared

  stage-7b-postgres-rehearsal:
    name: Stage 7B disposable PostgreSQL rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Create disposable database
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host localhost --username postgres stage7b_rehearsal
          createdb --host localhost --username postgres stage7b_lovable_rehearsal
          createdb --host localhost --username postgres stage7b_v2_rehearsal
          createdb --host localhost --username postgres voice_retention_rehearsal
          createdb --host localhost --username postgres voice_retention_lovable_rehearsal
          createdb --host localhost --username postgres voice_retention_lovable_rebuild_rehearsal
          createdb --host localhost --username postgres voice_turn_single_flight_rehearsal
          createdb --host localhost --username postgres voice_escalation_recipient_rehearsal
          createdb --host localhost --username postgres bluladder_klamath_phase1c_rehearsal
          createdb --host localhost --username postgres bluladder_klamath_stage8a_compat_rehearsal
          createdb --host localhost --username postgres bluladder_klamath_phase1f_rehearsal
      - name: Rehearse immutable direct-psql Stage 7B payload
        env:
          STAGE7B_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stage7b_rehearsal
        run: ./scripts/rehearse-stage-7b-postgres.sh
      - name: Rehearse immutable Lovable-native Stage 7B payload
        env:
          STAGE7B_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stage7b_lovable_rehearsal
        run: bash scripts/rehearse-stage-7b-lovable-postgres.sh
      - name: Rehearse Stage 7B v2 tenant authority migration
        env:
          STAGE7B_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stage7b_v2_rehearsal
        run: bash scripts/rehearse-stage-7b-v2-postgres.sh
      - name: Rehearse bounded voice artifact retention
        env:
          VOICE_RETENTION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/voice_retention_rehearsal
        run: bash scripts/rehearse-voice-artifact-retention-postgres.sh
      - name: Rehearse Lovable voice retention release control
        env:
          VOICE_RETENTION_LOVABLE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/voice_retention_lovable_rehearsal
          VOICE_RETENTION_LOVABLE_REBUILD_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/voice_retention_lovable_rebuild_rehearsal
        run: bash scripts/rehearse-voice-artifact-retention-lovable-postgres.sh
      - name: Rehearse voice turn single-flight release candidate
        env:
          VOICE_TURN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/voice_turn_single_flight_rehearsal
        run: bash scripts/rehearse-voice-turn-single-flight-postgres.sh
      - name: Rehearse tenant-scoped voice escalation recipients
        env:
          VOICE_ESCALATION_RECIPIENT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/voice_escalation_recipient_rehearsal
        run: bash scripts/rehearse-voice-escalation-recipients-postgres.sh
      - name: Rehearse inactive BluLadder Klamath Phase 1C foundation
        env:
          BLULADDER_KLAMATH_PHASE1C_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bluladder_klamath_phase1c_rehearsal
        run: bash scripts/rehearse-bluladder-klamath-phase-1c-postgres.sh
      - name: Rehearse BluLadder Klamath Stage 8A hosted compatibility
        env:
          BLULADDER_KLAMATH_STAGE8A_COMPAT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bluladder_klamath_stage8a_compat_rehearsal
        run: bash scripts/rehearse-bluladder-klamath-stage-8a-hosted-compat-postgres.sh
      - name: Rehearse BluLadder Klamath Phase 1F portal tenant lineage
        env:
          BLULADDER_KLAMATH_PHASE1F_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bluladder_klamath_phase1f_rehearsal
        run: bash scripts/rehearse-bluladder-klamath-phase-1f-portal-lineage-postgres.sh

  campaigns-inactive-guard:
    name: Campaigns inactive guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Fail if a migration sets campaigns.status = 'active'
        run: |
          set -e
          if grep -RniE "campaigns\b.*status[[:space:]]*=[[:space:]]*'active'" supabase/migrations 2>/dev/null; then
            echo "::error::A migration activates a campaign. Campaign activation must be done via the admin UI, not migrations."
            exit 1
          fi
          echo "OK: no campaign activation found in migrations."
