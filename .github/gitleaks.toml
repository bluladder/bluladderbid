# Gitleaks config for BluLadder Bid.
# Extends the default ruleset and allowlists frontend-public VITE_* config
# that is intentionally shipped in the browser bundle.

[extend]
useDefault = true

[allowlist]
description = "Frontend-public configuration and repo-internal fixtures"
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)bun\.lock$''',
  '''(^|/)package-lock\.json$''',
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
]
regexes = [
  # VITE_* vars are build-time public by design.
  '''VITE_[A-Z0-9_]+\s*=''',
  # Supabase publishable/anon JWTs are meant to ship in the client bundle.
  '''"role"\s*:\s*"anon"''',
]

# The first commit in PR #50 contained this exact prose fragment. The scanner
# interpreted a launch-region phrase as high entropy. The text has been
# rewritten, but GitHub scans the immutable PR commit range. Keep this exception
# exact and line-targeted; it does not exempt assignments or credential formats.
[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Historical PR #50 documentation-only false positive"
  regexTarget = "line"
  regexes = [
    '''Run full authoritative validation, secret scan, Oregon/campaign guards; hash outputs''',
  ]

  [[rules.allowlists]]
  description = "Historical PR #110 JavaScript rehearsal-marker false positive"
  regexTarget = "line"
  regexes = [
    '''^\s*"SET ROLE authenticated",\s*$''',
  ]
